name: Check for new papers

on:
  schedule:
    # 08:00 Europe/Paris is UTC+2 (CEST) in summer and UTC+1 (CET) in
    # winter, so both candidate UTC times are scheduled; the "gate" job
    # below only lets the run proceed at the one that's actually 8am
    # in Paris, so this stays correct across the DST switch.
    - cron: "0 6 * * *" # 08:00 CEST
    - cron: "0 7 * * *" # 08:00 CET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Europe/Paris date +%H)"
          if [ "$hour" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check for new papers
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: uv run main.py check

      - name: Commit updated paper list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/papers.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update tracked papers"
            git push
          else
            echo "No changes to commit."
          fi
